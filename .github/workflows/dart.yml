name: Flutter CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Install latest Flutter from the master channel
      - uses: subosito/flutter-action@v2
        with:
          channel: master  # or beta if that's more stable for your needs

      - name: Flutter version check
        run: flutter --version  # Confirm Dart version is >= 3.8.1

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project source
        run: flutter analyze

      - name: Run tests
        run: flutter test
